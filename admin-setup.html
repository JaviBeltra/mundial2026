<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:30px;text-align:center;}
button{background:#F5C842;color:#0A0A0A;border:none;padding:16px 32px;border-radius:10px;font-size:16px;font-weight:700;margin:10px;width:100%;cursor:pointer;}
#msg{margin-top:20px;font-size:14px;color:#aaa;line-height:1.6;}
</style>
</head>
<body>
<h2>⚙️ Setup Admin</h2>
<p style="color:#aaa;font-size:13px;">Toca el botón para activar tu acceso de administrador.</p>
<button onclick="setAdmin()">Activar Admin</button>
<div id="msg"></div>
<script>
const DB = 'https://mundial2026-a0eec-default-rtdb.firebaseio.com';
const PLAYER_ID = 'p_1780606435428';
const ADMIN_KEY = 'javi_admin_2026';

async function setAdmin(){
  document.getElementById('msg').textContent = 'Activando...';
  try {
    const res = await fetch(`${DB}/players/${PLAYER_ID}/adminKey.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(ADMIN_KEY)
    });
    if(res.ok){
      document.getElementById('msg').innerHTML = '✅ <strong style="color:#4ADE80;">¡Listo! Sos admin.</strong><br><br>Volvé a la app, cerrá sesión y volvé a ingresar. El Panel Admin va a aparecer en Estadísticas.';
    } else {
      document.getElementById('msg').textContent = '❌ Error: ' + res.status;
    }
  } catch(e) {
    document.getElementById('msg').textContent = '❌ Error: ' + e.message;
  }
}
</script>
</body>
</html>
