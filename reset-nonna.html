<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:30px;text-align:center;}
button{background:#F5C842;color:#0A0A0A;border:none;padding:16px 32px;border-radius:10px;font-size:16px;font-weight:700;margin:10px;width:100%;cursor:pointer;}
#msg{margin-top:20px;font-size:14px;color:#aaa;line-height:1.6;}
</style>
</head>
<body>
<h2>🔄 Resetear cuenta Nonna</h2>
<p style="color:#aaa;font-size:13px;">Borra la cuenta de Nonna para que pueda crearla de nuevo con PIN.</p>
<button onclick="reset()">Borrar cuenta Nonna</button>
<div id="msg"></div>
<script>
const DB = 'https://mundial2026-a0eec-default-rtdb.firebaseio.com';
async function reset(){
  document.getElementById('msg').textContent = 'Borrando...';
  try {
    await fetch(`${DB}/players/p_1780615510008.json`, {method:'DELETE'});
    await fetch(`${DB}/predictions/p_1780615510008.json`, {method:'DELETE'});
    document.getElementById('msg').innerHTML = '✅ Listo. Nonna puede crear su cuenta de nuevo con PIN.';
  } catch(e) {
    document.getElementById('msg').textContent = '❌ Error: ' + e.message;
  }
}
</script>
</body>
</html>
