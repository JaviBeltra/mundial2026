<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:30px;text-align:center;}
button{background:#EF4444;color:white;border:none;padding:16px 32px;border-radius:10px;font-size:16px;font-weight:700;margin:10px;width:100%;cursor:pointer;}
.safe{background:#22C55E;}
#msg{margin-top:20px;font-size:14px;color:#aaa;}
</style>
</head>
<body>
<h2>🗑 Reset Firebase</h2>
<p style="color:#aaa;font-size:13px;">Borra todos los jugadores, pronósticos y resultados.</p>
<button onclick="resetAll()">Borrar TODO</button>
<button class="safe" onclick="window.close()">Cancelar</button>
<div id="msg"></div>
<script>
const DB = 'https://mundial2026-a0eec-default-rtdb.firebaseio.com';
async function resetAll(){
  if(!confirm('¿Seguro? Se borran TODOS los datos.')) return;
  document.getElementById('msg').textContent = 'Borrando...';
  try {
    await fetch(DB + '/players.json', {method:'DELETE'});
    await fetch(DB + '/predictions.json', {method:'DELETE'});
    await fetch(DB + '/results.json', {method:'DELETE'});
    document.getElementById('msg').textContent = '✅ Todo borrado. Ya podés volver a la app y crear tu cuenta.';
  } catch(e) {
    document.getElementById('msg').textContent = '❌ Error: ' + e.message;
  }
}
</script>
</body>
</html>
