<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="font-family:sans-serif;background:#0A1628;color:#EEF4FB;padding:30px;text-align:center;">
<h2>Test Firebase REST</h2>
<div id="msg" style="margin-top:20px;font-size:14px;line-height:2;">Probando...</div>
<script>
var msg = document.getElementById('msg');
var DB = 'https://mundial2026-a0eec-default-rtdb.firebaseio.com';

msg.innerHTML += '<br>1. Iniciando fetch...';

fetch(DB + '/players.json?shallow=true')
  .then(function(r){ 
    msg.innerHTML += '<br>2. Status: ' + r.status;
    return r.json(); 
  })
  .then(function(data){ 
    msg.innerHTML += '<br>3. Data: ' + JSON.stringify(data).substring(0,100);
    msg.innerHTML += '<br><strong style="color:#4ADE80;">✅ FUNCIONA</strong>';
  })
  .catch(function(e){ 
    msg.innerHTML += '<br>ERROR: ' + e.message;
    msg.innerHTML += '<br><strong style="color:#F87171;">❌ FALLA</strong>';
  });
</script>
</body>
</html>
