<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Mundial 2026</title>
<style>
body{margin:0;background:#0A1628;color:#EEF4FB;font-family:sans-serif;}
.header{background:linear-gradient(135deg,#003087,#0A1628);padding:40px 20px 20px;text-align:center;}
h1{font-size:40px;margin:0;color:#fff;font-weight:900;}
.sub{color:rgba(255,255,255,0.6);font-size:13px;margin-top:4px;}
.foto{width:100%;max-width:340px;border-radius:12px;border:2px solid rgba(116,172,223,0.4);margin:16px auto;display:block;}
.body{padding:20px;}
#status{color:#74ACDF;font-size:13px;margin-bottom:16px;text-align:center;}
.player{display:flex;align-items:center;gap:12px;padding:14px;background:#0F2040;border:1px solid rgba(116,172,223,0.2);border-radius:12px;margin-bottom:10px;cursor:pointer;}
.player img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1A3058;flex-shrink:0;}
.player-name{font-size:15px;font-weight:600;}
.arrow{color:#7A9CC0;font-size:22px;margin-left:auto;}
</style>
</head>
<body>
<div class="header">
  <div style="font-size:11px;letter-spacing:3px;color:rgba(116,172,223,0.8);">FIFA</div>
  <h1>MUNDIAL 2026</h1>
  <div class="sub">Juego de Pronósticos Familiar</div>
  <img src="familia.PNG" class="foto" onerror="this.style.display='none'">
  <div style="font-size:11px;letter-spacing:2px;color:rgba(116,172,223,0.6);margin-top:8px;">LA FAMILIA · MUNDIAL 2026</div>
</div>
<div class="body">
  <div id="status">Cargando jugadores...</div>
  <div id="list"></div>
</div>
<script>
var DB = 'https://mundial2026-a0eec-default-rtdb.firebaseio.com';
var players = [];

function loadPlayers(){
  fetch(DB + '/players.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data){
        players = Object.values(data).sort(function(a,b){ return a.name.localeCompare(b.name); });
      }
      showPlayers();
    })
    .catch(function(e){
      document.getElementById('status').textContent = 'Error: ' + e.message;
    });
}

function showPlayers(){
  var list = document.getElementById('list');
  var status = document.getElementById('status');
  if(!players.length){
    status.textContent = 'No hay jugadores.';
    return;
  }
  status.textContent = '¿Quién sos?';
  list.innerHTML = players.map(function(p){
    return '<div class="player" onclick="login(\'' + p.id + '\')">'
      + '<img src="' + (p.avatar||'') + '" onerror="this.style.background=\'#1A3058\'">'
      + '<div class="player-name">' + p.name + '</div>'
      + '<div class="arrow">›</div>'
      + '</div>';
  }).join('');
}

function login(id){
  var p = players.find(function(x){ return x.id === id; });
  if(p){
    localStorage.setItem('mw26u', JSON.stringify(p));
    alert('¡Hola ' + p.name + '! La app completa estará lista pronto.');
  }
}

loadPlayers();
</script>
</body>
</html>
