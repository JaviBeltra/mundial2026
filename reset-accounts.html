<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:30px;text-align:center;}
button{background:#F5C842;color:#0A0A0A;border:none;padding:16px 32px;border-radius:10px;font-size:16px;font-weight:700;margin:10px;width:100%;cursor:pointer;}
#msg{margin-top:20px;font-size:14px;color:#aaa;line-height:1.6;}
</style>
</head>
<body>
<h2>🔄 Borrar cuentas con PIN roto</h2>
<p style="color:#aaa;font-size:13px;">Borra las cuentas creadas con el código anterior (excepto Javier).</p>
<button onclick="reset()">Borrar cuentas</button>
<div id="msg"></div>
<script>
const DB = 'https://mundial2026-a0eec-default-rtdb.firebaseio.com';
const IDS = ['p_1780616540531','p_1780616849981'];
async function reset(){
  document.getElementById('msg').textContent = 'Borrando...';
  try {
    for(const id of IDS){
      await fetch(`${DB}/players/${id}.json`, {method:'DELETE'});
      await fetch(`${DB}/predictions/${id}.json`, {method:'DELETE'});
    }
    document.getElementById('msg').innerHTML = '✅ Listo. Las cuentas fueron borradas.<br>Podés crear las cuentas de nuevo con el nuevo código.';
  } catch(e) {
    document.getElementById('msg').textContent = '❌ Error: ' + e.message;
  }
}
</script>
</body>
</html>
